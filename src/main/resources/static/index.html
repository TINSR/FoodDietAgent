<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康饮食 - 小食</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; }

        /* Header */
        .header { background: linear-gradient(135deg, #4CAF50, #8BC34A); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { font-size: 14px; opacity: 0.9; }

        /* Tab Bar */
        .tab-bar { display: flex; background: #fff; border-bottom: 1px solid #eee; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { border-color: #4CAF50; color: #4CAF50; }

        /* Page */
        .page { display: none; padding: 20px; }
        .page.active { display: block; }

        /* Calorie Ring */
        .calorie-ring { text-align: center; padding: 20px 0; }
        .ring { width: 180px; height: 180px; border-radius: 50%; margin: 0 auto 15px; position: relative; background: #eee; }
        .ring-inner { position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .ring-value { font-size: 32px; font-weight: bold; color: #333; }
        .ring-label { font-size: 14px; color: #999; }
        .ring-status { font-size: 16px; margin-top: 10px; padding: 5px 15px; border-radius: 15px; display: inline-block; }
        .ring-status.normal { background: #E8F5E9; color: #4CAF50; }
        .ring-status.warning { background: #FFF3E0; color: #FF9800; }
        .ring-status.danger { background: #FFEBEE; color: #F44336; }

        /* Nutrient Bar */
        .nutrient-list { margin-top: 20px; }
        .nutrient-item { display: flex; align-items: center; margin-bottom: 15px; }
        .nutrient-name { width: 60px; font-size: 14px; color: #666; }
        .nutrient-bar { flex: 1; height: 8px; background: #eee; border-radius: 4px; margin: 0 10px; overflow: hidden; }
        .nutrient-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .nutrient-bar-fill.carb { background: #FF9800; }
        .nutrient-bar-fill.protein { background: #4CAF50; }
        .nutrient-bar-fill.fat { background: #9C27B0; }
        .nutrient-value { width: 80px; text-align: right; font-size: 14px; color: #333; }

        /* Meal Section */
        .meal-section { margin-top: 20px; }
        .meal-title { font-size: 16px; font-weight: bold; color: #333; padding: 10px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .meal-title span { color: #4CAF50; font-size: 14px; }
        .food-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
        .food-name { font-size: 14px; color: #333; }
        .food-info { font-size: 12px; color: #999; }
        .food-cal { font-size: 14px; color: #666; }
        .add-food-btn { width: 100%; padding: 12px; background: #4CAF50; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 15px; }

        /* Form */
        .form-group { margin-bottom: 15px; }
        .form-label { font-size: 14px; color: #666; margin-bottom: 5px; display: block; }
        .form-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-btn { width: 100%; padding: 12px; background: #4CAF50; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }

        /* Search */
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .search-btn { padding: 10px 20px; background: #4CAF50; color: #fff; border: none; border-radius: 8px; }

        /* Food List */
        .food-list { border: 1px solid #eee; border-radius: 8px; }
        .food-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        .food-list-item:last-child { border-bottom: none; }
        .food-list-item:hover { background: #f9f9f9; }
        .food-list-name { font-size: 14px; color: #333; }
        .food-list-info { font-size: 12px; color: #999; }
        .food-list-cal { font-size: 14px; color: #4CAF50; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: #fff; border-radius: 12px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; padding: 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-title { font-size: 18px; font-weight: bold; }
        .modal-close { font-size: 24px; cursor: pointer; }

        /* User Profile */
        .profile-card { background: linear-gradient(135deg, #4CAF50, #8BC34A); border-radius: 12px; padding: 20px; color: #fff; margin-bottom: 20px; }
        .profile-name { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .profile-info { font-size: 14px; opacity: 0.9; }
        .profile-target { font-size: 32px; font-weight: bold; margin-top: 15px; }
        .profile-target span { font-size: 14px; opacity: 0.8; }

        /* Advice Card */
        .advice-card { background: #E8F5E9; border-radius: 8px; padding: 15px; margin-top: 20px; }
        .advice-title { font-size: 14px; color: #4CAF50; font-weight: bold; margin-bottom: 8px; }
        .advice-text { font-size: 14px; color: #333; line-height: 1.6; }

        /* Agent Chat */
        .chat-box { background: #f9f9f9; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .chat-message { font-size: 14px; color: #333; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>小食健康饮食</h1>
            <p>记录饮食 · 分析热量 · 智能推荐</p>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <div class="tab active" data-tab="home">今日</div>
            <div class="tab" data-tab="add">添加</div>
            <div class="tab" data-tab="search">搜索</div>
            <div class="tab" data-tab="profile">我的</div>
        </div>

        <!-- Home Page -->
        <div id="page-home" class="page active">
            <div class="calorie-ring">
                <div class="ring">
                    <div class="ring-inner">
                        <div class="ring-value" id="consumed-cal">0</div>
                        <div class="ring-label">/ <span id="target-cal">2000</span> kcal</div>
                    </div>
                </div>
                <div class="ring-status normal" id="status-text">正常</div>
            </div>

            <div class="nutrient-list">
                <div class="nutrient-item">
                    <div class="nutrient-name">碳水</div>
                    <div class="nutrient-bar"><div class="nutrient-bar-fill carb" id="carb-bar" style="width: 0%"></div></div>
                    <div class="nutrient-value"><span id="carb-val">0</span>g</div>
                </div>
                <div class="nutrient-item">
                    <div class="nutrient-name">蛋白质</div>
                    <div class="nutrient-bar"><div class="nutrient-bar-fill protein" id="protein-bar" style="width: 0%"></div></div>
                    <div class="nutrient-value"><span id="protein-val">0</span>g</div>
                </div>
                <div class="nutrient-item">
                    <div class="nutrient-name">脂肪</div>
                    <div class="nutrient-bar"><div class="nutrient-bar-fill fat" id="fat-bar" style="width: 0%"></div></div>
                    <div class="nutrient-value"><span id="fat-val">0</span>g</div>
                </div>
            </div>

            <div class="advice-card" id="advice-card" style="display:none;">
                <div class="advice-title">小食建议</div>
                <div class="advice-text" id="advice-text"></div>
            </div>

            <div id="meals-container"></div>
        </div>

        <!-- Add Page -->
        <div id="page-add" class="page">
            <div class="form-group">
                <label class="form-label">选择食物</label>
                <select class="form-select" id="food-select">
                    <option value="">-- 请选择食物 --</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">份量 (克)</label>
                <input type="number" class="form-input" id="food-weight" value="100" min="1">
            </div>
            <div class="form-group">
                <label class="form-label">餐次</label>
                <select class="form-select" id="meal-type">
                    <option value="早餐">早餐</option>
                    <option value="午餐">午餐</option>
                    <option value="晚餐">晚餐</option>
                    <option value="加餐">加餐</option>
                </select>
            </div>
            <button class="form-btn" onclick="addFood()">添加食物</button>
        </div>

        <!-- Search Page -->
        <div id="page-search" class="page">
            <div class="search-box">
                <input type="text" class="search-input" id="search-keyword" placeholder="搜索食物，如：米饭、苹果">
                <button class="search-btn" onclick="searchFood()">搜索</button>
            </div>
            <div class="food-list" id="search-results"></div>
        </div>

        <!-- Profile Page -->
        <div id="page-profile" class="page">
            <div class="profile-card">
                <div class="profile-name" id="profile-name">未注册</div>
                <div class="profile-info" id="profile-info">点击下方按钮注册</div>
                <div class="profile-target"><span id="profile-target">0</span> <span>kcal/天</span></div>
            </div>

            <div id="profile-form" style="display:none;">
                <div class="form-group">
                    <label class="form-label">姓名</label>
                    <input type="text" class="form-input" id="reg-name">
                </div>
                <div class="form-group">
                    <label class="form-label">年龄</label>
                    <input type="number" class="form-input" id="reg-age">
                </div>
                <div class="form-group">
                    <label class="form-label">性别</label>
                    <select class="form-select" id="reg-gender">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">身高 (cm)</label>
                    <input type="number" class="form-input" id="reg-height">
                </div>
                <div class="form-group">
                    <label class="form-label">体重 (kg)</label>
                    <input type="number" class="form-input" id="reg-weight">
                </div>
                <div class="form-group">
                    <label class="form-label">目标</label>
                    <select class="form-select" id="reg-goal">
                        <option value="减肥">减肥</option>
                        <option value="维持">维持</option>
                        <option value="增肌">增肌</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">活动水平</label>
                    <select class="form-select" id="reg-activity">
                        <option value="久坐">久坐 (很少运动)</option>
                        <option value="轻度">轻度 (每周运动1-3次)</option>
                        <option value="中度">中度 (每周运动3-5次)</option>
                        <option value="重度">重度 (每天高强度运动)</option>
                    </select>
                </div>
                <button class="form-btn" onclick="registerUser()">注册/更新</button>
            </div>

            <button class="add-food-btn" id="profile-btn" onclick="showProfileForm()">注册/登录</button>
        </div>
    </div>

    <!-- Add Food Modal -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">添加食物</div>
                <div class="modal-close" onclick="closeModal()">&times;</div>
            </div>
            <div id="modal-food-info"></div>
            <div class="form-group" style="margin-top:15px;">
                <label class="form-label">份量 (克)</label>
                <input type="number" class="form-input" id="modal-weight" value="100">
            </div>
            <div class="form-group">
                <label class="form-label">餐次</label>
                <select class="form-select" id="modal-meal-type">
                    <option value="早餐">早餐</option>
                    <option value="午餐">午餐</option>
                    <option value="晚餐">晚餐</option>
                    <option value="加餐">加餐</option>
                </select>
            </div>
            <button class="form-btn" onclick="confirmAddFood()">确认添加</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let currentUserId = 1;
        let currentFoodId = null;

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('page-' + tab.dataset.tab).classList.add('active');

                if (tab.dataset.tab === 'home') loadTodaySummary();
                if (tab.dataset.tab === 'add') loadFoods();
                if (tab.dataset.tab === 'profile') loadProfile();
            });
        });

        // Load today's summary
        async function loadTodaySummary() {
            const today = new Date().toISOString().split('T')[0];
            try {
                const res = await fetch(`${API_BASE}/summary/${currentUserId}/${today}`);
                const json = await res.json();
                if (json.code === 200) {
                    updateSummaryUI(json.data);
                }
            } catch (e) {
                console.log('No data yet');
            }
        }

        function updateSummaryUI(data) {
            document.getElementById('consumed-cal').textContent = data.consumedCalories;
            document.getElementById('target-cal').textContent = data.targetCalories;
            document.getElementById('status-text').textContent = data.status;
            document.getElementById('status-text').className = 'ring-status ' +
                (data.status === '正常' ? 'normal' : data.status === '超标' ? 'danger' : 'warning');

            document.getElementById('carb-val').textContent = data.totalCarb;
            document.getElementById('protein-val').textContent = data.totalProtein;
            document.getElementById('fat-val').textContent = data.totalFat;

            // Calculate progress (assuming 250g carb, 80g protein, 65g fat targets)
            document.getElementById('carb-bar').style.width = Math.min(100, data.totalCarb / 2.5) + '%';
            document.getElementById('protein-bar').style.width = Math.min(100, data.totalProtein / 0.8) + '%';
            document.getElementById('fat-bar').style.width = Math.min(100, data.totalFat / 0.65) + '%';

            // Advice
            if (data.agentAdvice) {
                document.getElementById('advice-card').style.display = 'block';
                document.getElementById('advice-text').textContent = data.agentAdvice;
            }

            // Meals
            let mealsHtml = '';
            data.meals.forEach(meal => {
                if (meal.foods.length > 0) {
                    mealsHtml += `
                        <div class="meal-section">
                            <div class="meal-title">${meal.mealType} <span>${meal.calories} kcal</span></div>
                            ${meal.foods.map(f => `
                                <div class="food-item">
                                    <div>
                                        <div class="food-name">${f.foodName}</div>
                                        <div class="food-info">${f.weight}g</div>
                                    </div>
                                    <div class="food-cal">${f.calories} kcal</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            });
            document.getElementById('meals-container').innerHTML = mealsHtml;
        }

        // Load foods for dropdown
        async function loadFoods() {
            try {
                const res = await fetch(`${API_BASE}/food/log/search?keyword=`);
                const json = await res.json();
                if (json.code === 200) {
                    let options = '<option value="">-- 请选择食物 --</option>';
                    json.data.forEach(food => {
                        options += `<option value="${food.id}">${food.name} (${food.caloriesPer100g}kcal/100g)</option>`;
                    });
                    document.getElementById('food-select').innerHTML = options;
                }
            } catch (e) {
                console.log(e);
            }
        }

        // Add food
        async function addFood() {
            const foodId = document.getElementById('food-select').value;
            const weight = document.getElementById('food-weight').value;
            const mealType = document.getElementById('meal-type').value;

            if (!foodId) {
                alert('请选择食物');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/food/log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUserId,
                        foodId: parseInt(foodId),
                        weight: parseInt(weight),
                        mealType: mealType
                    })
                });
                const json = await res.json();
                if (json.code === 200) {
                    alert('添加成功');
                    document.querySelector('[data-tab="home"]').click();
                }
            } catch (e) {
                alert('添加失败');
            }
        }

        // Search food
        async function searchFood() {
            const keyword = document.getElementById('search-keyword').value;
            try {
                const res = await fetch(`${API_BASE}/food/log/search?keyword=${encodeURIComponent(keyword)}`);
                const json = await res.json();
                if (json.code === 200) {
                    let html = '';
                    json.data.forEach(food => {
                        html += `
                            <div class="food-list-item" onclick="selectFood(${food.id}, '${food.name}', ${food.caloriesPer100g})">
                                <div>
                                    <div class="food-list-name">${food.name}</div>
                                    <div class="food-list-info">${food.category} · ${food.proteinPer100g}g蛋白 · ${food.carbsPer100g}g碳水</div>
                                </div>
                                <div class="food-list-cal">${food.caloriesPer100g} kcal</div>
                            </div>
                        `;
                    });
                    document.getElementById('search-results').innerHTML = html || '没有找到相关食物';
                }
            } catch (e) {
                console.log(e);
            }
        }

        function selectFood(foodId, name, cal) {
            currentFoodId = foodId;
            document.getElementById('modal-food-info').innerHTML = `
                <div style="padding:10px;background:#f5f5f5;border-radius:8px;">
                    <div style="font-size:16px;font-weight:bold;">${name}</div>
                    <div style="font-size:14px;color:#666;">每100g: ${cal} kcal</div>
                </div>
            `;
            document.getElementById('add-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('add-modal').classList.remove('active');
        }

        async function confirmAddFood() {
            const weight = document.getElementById('modal-weight').value;
            const mealType = document.getElementById('modal-meal-type').value;

            try {
                const res = await fetch(`${API_BASE}/food/log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUserId,
                        foodId: currentFoodId,
                        weight: parseInt(weight),
                        mealType: mealType
                    })
                });
                const json = await res.json();
                if (json.code === 200) {
                    alert('添加成功');
                    closeModal();
                    document.querySelector('[data-tab="home"]').click();
                }
            } catch (e) {
                alert('添加失败');
            }
        }

        // Load profile
        async function loadProfile() {
            try {
                const res = await fetch(`${API_BASE}/user/${currentUserId}`);
                const json = await res.json();
                if (json.code === 200) {
                    document.getElementById('profile-name').textContent = json.data.name;
                    document.getElementById('profile-info').textContent =
                        `${json.data.age}岁 · ${json.data.gender} · ${json.data.height}cm · ${json.data.weight}kg`;
                    document.getElementById('profile-target').textContent = json.data.dailyCalorieTarget;
                    document.getElementById('profile-btn').textContent = '更新信息';

                    // Fill form
                    document.getElementById('reg-name').value = json.data.name;
                    document.getElementById('reg-age').value = json.data.age;
                    document.getElementById('reg-gender').value = json.data.gender;
                    document.getElementById('reg-height').value = json.data.height;
                    document.getElementById('reg-weight').value = json.data.weight;
                    document.getElementById('reg-goal').value = json.data.goal;
                    document.getElementById('reg-activity').value = json.data.activityLevel;
                }
            } catch (e) {
                console.log(e);
            }
        }

        function showProfileForm() {
            const form = document.getElementById('profile-form');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        async function registerUser() {
            const data = {
                name: document.getElementById('reg-name').value,
                age: parseInt(document.getElementById('reg-age').value),
                gender: document.getElementById('reg-gender').value,
                height: parseFloat(document.getElementById('reg-height').value),
                weight: parseFloat(document.getElementById('reg-weight').value),
                goal: document.getElementById('reg-goal').value,
                activityLevel: document.getElementById('reg-activity').value
            };

            try {
                const res = await fetch(`${API_BASE}/user/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                if (json.code === 200) {
                    alert('注册成功');
                    loadProfile();
                    loadTodaySummary();
                }
            } catch (e) {
                alert('注册失败');
            }
        }

        // Load on start
        loadTodaySummary();
        loadFoods();
    </script>
</body>
</html>
