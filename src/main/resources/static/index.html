<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康饮食 - 小食</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Header */
        .header { background: linear-gradient(135deg, #4CAF50, #8BC34A); color: white; padding: 15px; text-align: center; flex-shrink: 0; }
        .header h1 { font-size: 22px; margin-bottom: 5px; }
        .header p { font-size: 13px; opacity: 0.9; }

        /* Tab Bar */
        .tab-bar { display: flex; background: #fff; border-bottom: 1px solid #eee; flex-shrink: 0; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; font-size: 14px; }
        .tab.active { border-color: #4CAF50; color: #4CAF50; }

        /* AI Page */
        #page-ai { display: none; flex-direction: column; }
        #page-ai.active { display: flex; }
        #chat-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 0; display: flex; flex-direction: column; gap: 10px; }
        .page { display: none; flex: 1; min-height: 0; overflow: hidden; padding: 15px; }
        .page.active { display: flex; flex-direction: column; }

        /* Calorie Ring */
        .calorie-ring { text-align: center; padding: 15px 0; }
        .ring { width: 160px; height: 160px; border-radius: 50%; margin: 0 auto 10px; position: relative; background: #eee; display: flex; align-items: center; justify-content: center; }
        .ring-inner { width: 130px; height: 130px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .ring-value { font-size: 28px; font-weight: bold; color: #333; }
        .ring-label { font-size: 12px; color: #999; }
        .ring-status { font-size: 14px; padding: 5px 15px; border-radius: 15px; display: inline-block; }
        .ring-status.normal { background: #E8F5E9; color: #4CAF50; }
        .ring-status.warning { background: #FFF3E0; color: #FF9800; }
        .ring-status.danger { background: #FFEBEE; color: #F44336; }

        /* Nutrient Bar */
        .nutrient-list { margin-top: 15px; }
        .nutrient-item { display: flex; align-items: center; margin-bottom: 10px; }
        .nutrient-name { width: 50px; font-size: 12px; color: #666; }
        .nutrient-bar { flex: 1; height: 6px; background: #eee; border-radius: 3px; margin: 0 8px; overflow: hidden; position: relative; }
        .nutrient-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .nutrient-bar-fill.carb { background: #FF9800; }
        .nutrient-bar-fill.protein { background: #4CAF50; }
        .nutrient-bar-fill.fat { background: #9C27B0; }
        .nutrient-value { width: 70px; text-align: right; font-size: 12px; color: #333; }
        .nutrient-target { font-size: 10px; color: #999; }

        /* Meal Section */
        .meal-section { margin-top: 10px; background: #fafafa; border-radius: 10px; padding: 10px 12px; border-left: 4px solid #4CAF50; }
        .meal-section.breakfast { border-left-color: #FF9800; }
        .meal-section.lunch { border-left-color: #4CAF50; }
        .meal-section.dinner { border-left-color: #9C27B0; }
        .meal-section.snack { border-left-color: #2196F3; }
        .meal-title { font-size: 14px; font-weight: bold; color: #333; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .meal-title span { color: #4CAF50; font-size: 12px; }
        .food-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
        .food-name { font-size: 13px; color: #333; }
        .food-info { font-size: 11px; color: #999; }
        .food-cal { font-size: 13px; color: #666; }
        .add-food-btn { width: 100%; padding: 10px; background: #4CAF50; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 12px; }

        /* Recipe Card */
        .recipe-section { margin-top: 20px; }
        .recipe-title { font-size: 14px; font-weight: bold; color: #333; padding: 8px 0; border-bottom: 1px solid #eee; }
        .recipe-card { background: #f9f9f9; border-radius: 8px; padding: 12px; margin-top: 10px; }
        .recipe-name { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .recipe-desc { font-size: 12px; color: #666; margin-bottom: 8px; }
        .recipe-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
        .recipe-tag { background: #E8F5E9; color: #4CAF50; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
        .recipe-macro { display: flex; gap: 15px; font-size: 12px; color: #666; }
        .recipe-calories { font-size: 14px; color: #4CAF50; font-weight: bold; }
        .recipe-ingredients { font-size: 11px; color: #999; margin-top: 5px; }

        /* Advice Card */
        .advice-card { background: linear-gradient(135deg, #E8F5E9, #C8E6C9); border-radius: 8px; padding: 12px; margin-top: 15px; }
        .advice-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .advice-icon { font-size: 18px; }
        .advice-title { font-size: 13px; color: #2E7D32; font-weight: bold; }
        .advice-text { font-size: 13px; color: #333; line-height: 1.5; }
        .advice-tip { font-size: 12px; color: #666; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #A5D6A7; }

        /* Form */
        .form-group { margin-bottom: 12px; }
        .form-label { font-size: 13px; color: #666; margin-bottom: 4px; display: block; }
        .form-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-btn { width: 100%; padding: 12px; background: #4CAF50; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }

        /* Search */
        .search-box { display: flex; gap: 10px; margin-bottom: 12px; }
        .search-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .search-btn { padding: 10px 15px; background: #4CAF50; color: #fff; border: none; border-radius: 8px; }

        /* Food List */
        .food-list { border: 1px solid #eee; border-radius: 8px; }
        .food-list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .food-list-item:last-child { border-bottom: none; }
        .food-list-item:hover { background: #f9f9f9; }
        .food-list-name { font-size: 13px; color: #333; }
        .food-list-info { font-size: 11px; color: #999; }
        .food-list-cal { font-size: 13px; color: #4CAF50; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: #fff; border-radius: 12px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; padding: 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .modal-title { font-size: 16px; font-weight: bold; }
        .modal-close { font-size: 20px; cursor: pointer; }

        /* User Profile */
        .profile-card { background: linear-gradient(135deg, #4CAF50, #8BC34A); border-radius: 12px; padding: 15px; color: #fff; margin-bottom: 15px; }
        .profile-name { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .profile-info { font-size: 13px; opacity: 0.9; }
        .profile-target { font-size: 28px; font-weight: bold; margin-top: 12px; }
        .profile-target span { font-size: 13px; opacity: 0.8; }
        .profile-macros { display: flex; gap: 15px; margin-top: 10px; font-size: 12px; }
        .profile-macro { background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 10px; }

        /* Loading */
        .loading { text-align: center; padding: 20px; color: #999; font-size: 13px; }
        .section-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }

        /* Recognition Camera Button */
        .camera-btn { background: linear-gradient(135deg, #FF9800, #FF5722); color: #fff; border: none; padding: 12px 20px; border-radius: 25px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; margin: 10px 0; }
        .camera-btn:active { transform: scale(0.98); }

        /* Recognition Modal */
        .recognition-type-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; margin-bottom: 10px; }
        .recognition-type-badge.dish { background: #FFF3E0; color: #FF9800; }
        .recognition-type-badge.packaged { background: #E3F2FD; color: #2196F3; }
        .ingredient-item { background: #f9f9f9; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
        .ingredient-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .ingredient-name { flex: 1; font-size: 13px; font-weight: 600; }
        .ingredient-match { font-size: 10px; padding: 2px 6px; border-radius: 8px; background: #E8F5E9; color: #4CAF50; }
        .ingredient-match.unmatched { background: #FFF3E0; color: #FF9800; }
        .ingredient-input { width: 60px; padding: 6px; border: 1px solid #ddd; border-radius: 4px; text-align: center; font-size: 13px; }
        .ingredient-input.weight { width: 70px; }
        .ingredient-cal { font-size: 12px; color: #4CAF50; min-width: 70px; text-align: right; }
        .total-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #4CAF50; color: #fff; border-radius: 8px; margin: 10px 0; }
        .total-label { font-size: 14px; font-weight: bold; }
        .total-value { font-size: 18px; font-weight: bold; }
        .save-options { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
        .save-option { display: flex; align-items: center; gap: 8px; padding: 10px; background: #f5f5f5; border-radius: 8px; cursor: pointer; }
        .save-option input[type="checkbox"] { width: 18px; height: 18px; }
        .save-option-label { font-size: 13px; }
        .barcode-input { display: flex; gap: 8px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>小食健康饮食</h1>
            <p>智能推荐 · 营养均衡 · 科学配比</p>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <div class="tab active" data-tab="home">今日</div>
            <div class="tab" data-tab="ai">AI分析</div>
            <div class="tab" data-tab="add">添加</div>
            <div class="tab" data-tab="profile">我的</div>
        </div>

        <!-- Home Page -->
        <div id="page-home" class="page active">
            <!-- Date Picker -->
            <div id="date-picker" style="display:flex;gap:6px;padding:10px 0;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;"></div>

            <!-- Highlights -->
            <div id="highlights-bar" style="display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px 0;flex-shrink:0;"></div>

            <!-- Scrollable Content -->
            <div style="flex:1;min-height:0;overflow-y:auto;" id="home-content">
            <div class="calorie-ring">
                <div class="ring" id="calorie-ring"></div>
                <div class="ring-status normal" id="status-text">正常</div>
            </div>

            <div class="nutrient-list">
                <div class="nutrient-item">
                    <div class="nutrient-name">碳水</div>
                    <div class="nutrient-bar"><div class="nutrient-bar-fill carb" id="carb-bar" style="width: 0%"></div></div>
                    <div class="nutrient-value"><span id="carb-val">0</span>g <span class="nutrient-target">/ <span id="carb-target">0</span>g</span></div>
                </div>
                <div class="nutrient-item">
                    <div class="nutrient-name">蛋白质</div>
                    <div class="nutrient-bar"><div class="nutrient-bar-fill protein" id="protein-bar" style="width: 0%"></div></div>
                    <div class="nutrient-value"><span id="protein-val">0</span>g <span class="nutrient-target">/ <span id="protein-target">0</span>g</span></div>
                </div>
                <div class="nutrient-item">
                    <div class="nutrient-name">脂肪</div>
                    <div class="nutrient-bar"><div class="nutrient-bar-fill fat" id="fat-bar" style="width: 0%"></div></div>
                    <div class="nutrient-value"><span id="fat-val">0</span>g <span class="nutrient-target">/ <span id="fat-target">0</span>g</span></div>
                </div>
            </div>

            <!-- AI Advice -->
            <div class="advice-card" id="advice-card" style="display:none;">
                <div class="advice-header">
                    <span class="advice-icon">💡</span>
                    <span class="advice-title">小食建议</span>
                    <button onclick="refreshAgent()" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:16px;" title="刷新">🔄</button>
                </div>
                <div class="advice-text" id="advice-text"></div>
                <div class="advice-tip" id="advice-tip" style="display:none;"></div>
            </div>

            <!-- Recipes Section -->
            <div class="recipe-section" id="recipe-section" style="display:none;">
                <div class="section-title">🍽️ 今日推荐食谱 <button onclick="refreshAgent()" style="background:none;border:none;cursor:pointer;font-size:14px;" title="刷新">🔄</button></div>
                <div id="recipes-container"></div>
            </div>

            <div id="meals-container"></div>
            </div><!-- end home-content -->
        </div>

        <!-- AI Analysis Page -->
        <div id="page-ai" class="page">
            <div class="section-title" style="flex-shrink:0;">🤖 AI 营养助手</div>

            <!-- Chat Messages -->
            <div id="chat-messages" style="flex:1;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column;gap:10px;">
                <div style="text-align:center;color:#999;font-size:13px;padding:20px 0;">
                    选择下方问题，我会为你分析
                </div>
            </div>

            <!-- Quick Actions -->
            <div style="flex-shrink:0;border-top:1px solid #eee;padding-top:10px;margin-top:10px;">
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
                    <button class="form-btn" style="flex:1;min-width:120px;font-size:12px;padding:8px;" onclick="sendChat('今日热量分析')">📊 今日热量分析</button>
                    <button class="form-btn" style="flex:1;min-width:120px;font-size:12px;padding:8px;" onclick="sendChat('今日菜品推荐')">🍽️ 今日菜品推荐</button>
                    <button class="form-btn" style="flex:1;min-width:120px;font-size:12px;padding:8px;" onclick="sendChat('近热量报告')">📈 近热量报告</button>
                </div>
                <div style="display:flex;gap:8px;">
                    <input type="text" class="form-input" id="chat-input" placeholder="输入问题..." style="flex:1;" onkeypress="if(event.key==='Enter')sendCustomChat()">
                    <button class="form-btn" onclick="sendCustomChat()">发送</button>
                </div>
            </div>
        </div>

        <!-- Add Page -->
        <div id="page-add" class="page">
            <div class="section-title">➕ 添加食物</div>

            <!-- Recognition Options -->
            <button class="camera-btn" onclick="openRecognitionModal()" style="width:100%;">
                📷 拍照识别食物热量
            </button>
            <div class="barcode-input">
                <input type="text" class="form-input" id="barcode-input" placeholder="或输入条形码（如：6901234567890）">
                <button class="search-btn" onclick="lookupBarcode()">查询</button>
            </div>

            <!-- Tab: 食物库 / 我的食物库 -->
            <div style="display:flex;gap:8px;margin-bottom:12px;">
                <button class="form-btn" id="tab-system-foods" onclick="switchFoodTab('system')" style="flex:1;background:#4CAF50;">🏪 食物库</button>
                <button class="form-btn" id="tab-my-foods" onclick="switchFoodTab('my')" style="flex:1;background:#8BC34A;">🍳 我的食物库</button>
            </div>

            <div id="add-system-section">
                <div class="search-box" style="margin-bottom:15px;">
                    <input type="text" class="search-input" id="search-keyword" placeholder="搜索食物，如：米饭、苹果">
                    <button class="search-btn" onclick="searchFood()">搜索</button>
                </div>
                <div class="food-list" id="search-results" style="margin-bottom:15px;"></div>
            </div>

            <div id="add-my-section" style="display:none;">
                <div id="my-foods-list" style="margin-bottom:15px;"></div>
            </div>

            <!-- Pending batch add list -->
            <div id="pending-add-list" style="display:none;margin-bottom:15px;">
                <div class="section-title" style="font-size:14px;margin-bottom:10px;">待添加列表</div>
                <div id="pending-items"></div>
                <button class="form-btn" style="margin-top:10px;width:100%;" onclick="confirmBatchAdd()">✓ 确定添加</button>
            </div>
        </div>

        <!-- Profile Page -->
        <div id="page-profile" class="page">
            <div class="profile-card" id="profile-card">
                <div class="profile-name" id="profile-name">未注册</div>
                <div class="profile-info" id="profile-info">点击下方按钮注册</div>
                <div class="profile-target"><span id="profile-target">0</span> <span>kcal/天</span></div>
                <div class="profile-macros" id="profile-macros" style="display:none;">
                    <span class="profile-macro">蛋白质 <span id="profile-protein">0</span>g</span>
                    <span class="profile-macro">碳水 <span id="profile-carbs">0</span>g</span>
                    <span class="profile-macro">脂肪 <span id="profile-fat">0</span>g</span>
                </div>
            </div>

            <button class="add-food-btn" id="profile-btn" onclick="showProfileForm()">注册/登录</button>

            <button class="add-food-btn" id="user-food-btn" onclick="showUserFoodLibrary()" style="background:#8BC34A;">🍳 我的食物库</button>

            <div id="user-food-library" style="display:none;margin-top:15px;"></div>

            <div id="profile-form" style="display:none;">
                <div class="form-group">
                    <label class="form-label">姓名</label>
                    <input type="text" class="form-input" id="reg-name">
                </div>
                <div class="form-group">
                    <label class="form-label">年龄</label>
                    <input type="number" class="form-input" id="reg-age">
                </div>
                <div class="form-group">
                    <label class="form-label">性别</label>
                    <select class="form-select" id="reg-gender">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">身高 (cm)</label>
                    <input type="number" class="form-input" id="reg-height">
                </div>
                <div class="form-group">
                    <label class="form-label">体重 (kg)</label>
                    <input type="number" class="form-input" id="reg-weight">
                </div>
                <div class="form-group">
                    <label class="form-label">目标</label>
                    <select class="form-select" id="reg-goal">
                        <option value="减肥">减肥</option>
                        <option value="维持">维持</option>
                        <option value="增肌">增肌</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">活动水平</label>
                    <select class="form-select" id="reg-activity">
                        <option value="久坐">久坐 (很少运动)</option>
                        <option value="轻度">轻度 (每周运动1-3次)</option>
                        <option value="中度">中度 (每周运动3-5次)</option>
                        <option value="重度">重度 (每天高强度运动)</option>
                    </select>
                </div>
                <button class="form-btn" onclick="registerUser()">保存</button>
            </div>

            <!-- Weekly Chart -->
            <div id="weekly-chart-section" style="margin-top:15px;">
                <div style="font-size:14px;font-weight:600;margin-bottom:10px;">📈 近7天热量</div>
                <div id="weekly-chart" style="display:flex;align-items:flex-end;justify-content:space-between;height:100px;gap:3px;"></div>
            </div>
        </div>
    </div>

    <!-- Add Food Modal -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">添加食物</div>
                <div class="modal-close" onclick="closeModal()">&times;</div>
            </div>
            <div id="modal-food-info"></div>
            <div class="form-group" style="margin-top:12px;">
                <label class="form-label">份量 (克)</label>
                <input type="number" class="form-input" id="modal-weight" value="100">
            </div>
            <div class="form-group">
                <label class="form-label">餐次</label>
                <select class="form-select" id="modal-meal-type">
                    <option value="早餐">早餐</option>
                    <option value="午餐">午餐</option>
                    <option value="晚餐">晚餐</option>
                    <option value="加餐">加餐</option>
                </select>
            </div>
            <button class="form-btn" onclick="confirmAddFood()">确认添加</button>
        </div>
    </div>

    <!-- Recognition Modal -->
    <div class="modal" id="recognition-modal">
        <div class="modal-content" id="recognition-modal-content">
            <div class="modal-header">
                <div class="modal-title">📷 识别结果</div>
                <div class="modal-close" onclick="closeRecognitionModal()">&times;</div>
            </div>
            <div id="recognition-result"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let currentUserId = null;
        let currentFoodId = null;
        let agentData = null;
        let agentCache = { data: null, time: 0 };
        const AGENT_CACHE_MINUTES = 30;

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('page-' + tab.dataset.tab).classList.add('active');

        function renderDatePicker() {
            const container = document.getElementById('date-picker');
            if (!container) return;
            const today = new Date();
            const days = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                days.push(d);
            }
            let html = '';
            days.forEach(d => {
                const iso = d.toISOString().split('T')[0];
                const dow = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
                const day = d.getDate();
                const isSelected = iso === currentSelectedDate;
                const isToday = iso === new Date().toISOString().split('T')[0];
                html += `<div class="date-chip" data-date="${iso}" onclick="selectDate('${iso}')" style="flex-shrink:0;padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;background:${isSelected?'#4CAF50':'#f5f5f5'};color:${isSelected?'#fff':'#333'};border:1px solid ${isToday&&!isSelected?'#4CAF50':'transparent'};">${dow} ${day}</div>`;
            });
            container.innerHTML = html;
        }

        function updateSummaryUI(data) {
            // Calorie ring
            const consumed = data.consumedCalories || 0;
            const target = data.targetCalories || 2000;
            const progress = Math.min(100, (consumed / target) * 100);
            const remaining = Math.max(0, target - consumed);

            const ringHtml = `
                <div class="ring-inner">
                    <div class="ring-value">${consumed}</div>
                    <div class="ring-label">/ ${target} kcal</div>
                    <div style="font-size:11px;color:#666;margin-top:3px;">剩余 ${remaining} kcal</div>
                </div>
                <svg width="160" height="160" style="position:absolute;top:0;left:0;">
                    <circle cx="80" cy="80" r="75" fill="none" stroke="#eee" stroke-width="10"/>
                    <circle cx="80" cy="80" r="75" fill="none" stroke="${progress > 100 ? '#F44336' : '#4CAF50'}" stroke-width="10"
                        stroke-dasharray="${progress * 4.71} 471"
                        stroke-linecap="round" transform="rotate(-90 80 80)"/>
                </svg>
            `;
            document.getElementById('calorie-ring').innerHTML = ringHtml;

            // Status
            const statusEl = document.getElementById('status-text');
            statusEl.textContent = data.status || '正常';
            statusEl.className = 'ring-status ' + (data.status === '正常' || data.status === '已达标' ? 'normal' : data.status === '超标' ? 'danger' : 'warning');

            // Highlights
            const hlBar = document.getElementById('highlights-bar');
            if (data.highlights && data.highlights.length > 0) {
                hlBar.innerHTML = data.highlights.map(h =>
                    `<span style="background:#f0f0f0;padding:4px 10px;border-radius:12px;font-size:12px;color:#333;">${h}</span>`
                ).join('');
            } else {
                hlBar.innerHTML = '';
            }

            // Macros with real progress
            const carbTarget = data.carbsTarget || 200;
            const proteinTarget = data.proteinTarget || 150;
            const fatTarget = data.fatTarget || 65;

            document.getElementById('carb-val').textContent = (data.totalCarb || 0).toFixed(1);
            document.getElementById('protein-val').textContent = (data.totalProtein || 0).toFixed(1);
            document.getElementById('fat-val').textContent = (data.totalFat || 0).toFixed(1);

            document.getElementById('carb-target').textContent = carbTarget;
            document.getElementById('protein-target').textContent = proteinTarget;
            document.getElementById('fat-target').textContent = fatTarget;

            const carbP = data.carbsProgress || 0;
            const proteinP = data.proteinProgress || 0;
            const fatP = data.fatProgress || 0;

            document.getElementById('carb-bar').style.width = Math.min(100, carbP) + '%';
            document.getElementById('protein-bar').style.width = Math.min(100, proteinP) + '%';
            document.getElementById('fat-bar').style.width = Math.min(100, fatP) + '%';

            // AI Advice
            document.getElementById('advice-card').style.display = 'none';

            // Meals
            let mealsHtml = '';
            if (data.meals && data.meals.length > 0) {
                data.meals.forEach(meal => {
                    if (meal.foods && meal.foods.length > 0) {
                    const mealClass = { '早餐': 'breakfast', '午餐': 'lunch', '晚餐': 'dinner', '加餐': 'snack' }[meal.mealType] || '';
                        mealsHtml += `
                            <div class="meal-section ${mealClass}">
                                <div class="meal-title">${meal.mealType} <span>${meal.calories || 0} kcal</span></div>
                                ${meal.foods.map(f => `
                                    <div class="food-item">
                                        <div>
                                            <div class="food-name">${f.foodName}</div>
                                            <div class="food-info">${f.weight || 0}g</div>
                                        </div>
                                        <div class="food-cal">${f.calories || 0} kcal</div>
                                        <button onclick="deleteFoodLogItem(${f.id})" style="color:#999;background:none;border:none;cursor:pointer;padding:0 4px;">✕</button>
                                    </div>
                                `).join('')}

                        `;
                    }
                });
            }
            document.getElementById('meals-container').innerHTML = mealsHtml;
        }

        // Send chat message
        async function sendChat(message) {
            if (!currentUserId) {
                addChatMessage('user', message);
                addChatMessage('ai', '请先在"我的"页面注册/登录后再使用AI分析功能。');
                return;
            }
            addChatMessage('user', message);
            addChatMessage('ai', '正在分析...');
            saveChatHistory();

            try {
                const res = await fetch(`${API_BASE}/agent/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUserId, message: message })
                });
                const json = await res.json();
                const messagesDiv = document.getElementById('chat-messages');
                const lastMsg = messagesDiv.lastElementChild;
                if (lastMsg && lastMsg.textContent === '正在分析...') lastMsg.remove();
                if (json.code === 200 && json.data) {
                    let fullResponse = '';
                    if (json.data.advice) fullResponse += json.data.advice;
                    if (json.data.tips) fullResponse += '\n\n💡 ' + json.data.tips;
                    if (!fullResponse || fullResponse === '正在分析...') fullResponse = '分析完成';
                    addChatMessage('ai', fullResponse);
                    saveChatHistory();

                    if (json.data.recipes && json.data.recipes.length > 0) {
                        const recipeSection = document.getElementById('ai-recipe-section');
                        if (recipeSection) recipeSection.style.display = 'block';
                        let recipesHtml = '';
                        json.data.recipes.forEach(r => {
                            recipesHtml += `
                                <div class="recipe-card">
                                    <div class="recipe-name">${r.name || '未知食谱'}</div>
                                    ${r.description ? `<div class="recipe-desc">${r.description}</div>` : ''}
                                    <div class="recipe-calories">${r.calories || 0} kcal</div>
                                    <div class="recipe-macro">
                                        <span>蛋白质 ${r.protein || 0}g</span>
                                        <span>碳水 ${r.carbs || 0}g</span>
                                        <span>脂肪 ${r.fat || 0}g</span>
                                    </div>
                                    ${r.ingredients && r.ingredients.length > 0 ? `<div class="recipe-ingredients">配料：${r.ingredients.join('、')}</div>` : ''}
                                </div>
                            `;
                        });
                        const recipesContainer = document.getElementById('ai-recipes-container');
                        if (recipesContainer) recipesContainer.innerHTML = recipesHtml;
                    }
                } else {
                    console.error('API error:', json.code, json.message);
                    addChatMessage('ai', json.message || '分析失败，请稍后重试');
                    saveChatHistory();
                }
            } catch (e) {
                console.error('Request failed:', e);
                const messagesDiv = document.getElementById('chat-messages');
                const lastMsg = messagesDiv ? messagesDiv.lastElementChild : null;
                if (lastMsg && lastMsg.textContent === '正在分析...') lastMsg.remove();
                if (messagesDiv) {
                    addChatMessage('ai', '网络错误，请稍后重试');
                    saveChatHistory();
                }
            }
        }

        const MAX_CHAT_MESSAGES = 50;
        function saveChatHistory() {
            const messagesDiv = document.getElementById('chat-messages');
            const msgs = [];
            messagesDiv.querySelectorAll('div').forEach(m => {
                const isUser = m.style.alignSelf === 'flex-end';
                msgs.push({ type: isUser ? 'user' : 'ai', text: m.dataset.original || m.innerText });
            });
            // Keep only last MAX_CHAT_MESSAGES
            const trimmed = msgs.length > MAX_CHAT_MESSAGES ? msgs.slice(-MAX_CHAT_MESSAGES) : msgs;
            if (currentUserId) {
                localStorage.setItem('chat_' + currentUserId, JSON.stringify(trimmed));
            }
        }

        function loadChatHistory() {
            if (!currentUserId) return;
            const saved = localStorage.getItem('chat_' + currentUserId);
            if (!saved) return;
            try {
                const msgs = JSON.parse(saved);
                const messagesDiv = document.getElementById('chat-messages');
                messagesDiv.innerHTML = '';
                msgs.forEach(m => addChatMessage(m.type, m.text));
            } catch (e) {}
        }

        function sendCustomChat() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            sendChat(msg);
        }

        function addChatMessage(type, text) {
            const messagesDiv = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.dataset.original = text;
            // Handle literal \n (from LLM escaped newlines) and real newlines
            const backslashN = String.fromCharCode(92) + 'n';
            const processed = text.split(backslashN).join('<br>').replace(/\n/g, '<br>');
            const escaped = processed.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            msgDiv.innerHTML = escaped;
            msgDiv.style.cssText = type === 'user'
                ? 'align-self:flex-end;background:#4CAF50;color:#fff;padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:80%;font-size:14px;word-break:break-word;'
                : 'align-self:flex-start;background:#f1f1f1;color:#333;padding:10px 14px;border-radius:16px 16px 16px 4px;max-width:80%;font-size:14px;word-break:break-word;';
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function confirmBatchAdd() {
            if (!pendingFoods.length || !currentUserId) return;
            let success = 0, failed = 0;
            for (const item of pendingFoods) {
                try {
                    const payload = { userId: currentUserId, weight: item.weight, mealType: item.mealType };
                    if (item.userFoodId) {
                        payload.userFoodId = item.userFoodId;
                    } else {
                        payload.foodId = item.foodId;
                    }
                    const res = await fetch(`${API_BASE}/food/log`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) success++;
                    else failed++;
                } catch (e) { failed++; }
            }
            alert(`添加完成：成功 ${success} 条${failed > 0 ? '，失败 ' + failed + ' 条' : ''}`);
            pendingFoods = [];
            renderPendingList();
            document.querySelector('[data-tab="home"]').click();
        }

        async function calcUfCalories() {
            // Live preview - just show 0 for now, real calc done server-side
            let total = 0;
            const ingRows = document.querySelectorAll('.uf-ing-row');
            for (const row of ingRows) {
                const select = row.querySelector('select');
                const weightInput = row.querySelector('input[type=number]');
                if (!select.value) continue;
                const food = allFoods.find(f => f.id == select.value);
                if (food) {
                    const w = parseInt(weightInput.value) || 0;
                    total += w * (food.caloriesPer100g || 0) / 100;
                }
            }
            document.getElementById('uf-total-cal').textContent = Math.round(total);
        }

            const today = new Date().toISOString().split('T')[0];

            container.innerHTML = data.map((d, i) => {
                const pct = d.consumedCalories / maxCal * 100;
                const isTarget = d.consumedCalories >= d.targetCalories * 0.9 && d.consumedCalories <= d.targetCalories * 1.1;
                const color = d.consumedCalories > d.targetCalories ? '#F44336' : isTarget ? '#4CAF50' : '#FF9800';
                const date = d.date ? d.date.split('-')[2] : '';
                return `
                    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-flex-end;height:100%;gap:4px;">

                        </div>
                        <div style="font-size:10px;color:#999;">${date}</div>
                    </div>
                `;
            }).join('');

        // ==================== Food Recognition ====================

        let currentRecognitionData = null;

        function openRecognitionModal() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    const base64 = ev.target.result.split(',')[1];
                    await recognizeFood(base64);
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        async function recognizeFood(imageBase64) {
            if (!currentUserId) {
                alert('请先登录');
                return;
            }
            const modal = document.getElementById('recognition-modal');
            const resultDiv = document.getElementById('recognition-result');
            resultDiv.innerHTML = '<div class="loading">🔄 AI正在识别中...</div>';
            modal.classList.add('active');

            try {
                const res = await fetch(`${API_BASE}/food/recognize/image`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: imageBase64,
                        userId: currentUserId,
                        mealType: inferCurrentMealType()
                    })
                });
                const json = await res.json();
                if (json.code === 200) {
                    currentRecognitionData = json.data;
                    renderRecognitionResult(json.data);
                } else {
                    resultDiv.innerHTML = `<div style="text-align:center;color:#F44336;padding:20px;">${json.message || '识别失败'}</div>`;
                }

                resultDiv.innerHTML = '<div style="text-align:center;color:#F44336;padding:20px;">网络错误，请重试</div>';

        function inferCurrentMealType() {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 10) return '早餐';
            if (hour >= 10 && hour < 15) return '午餐';
            if (hour >= 17 && hour < 21) return '晚餐';
            return '加餐';
        }

        function renderRecognitionResult(data) {
            const resultDiv = document.getElementById('recognition-result');
            const typeBadge = data.type === 'PACKAGED'
                ? '<span class="recognition-type-badge packaged">📦 包装食品</span>'

            let ingredientsHtml = '';
            if (data.ingredients && data.ingredients.length > 0) {
                ingredientsHtml = data.ingredients.map((ing, idx) => {
                    const matchClass = ing.matchedFoodId ? '' : 'unmatched';
                    const matchText = ing.matchedFoodId ? '已匹配' : '未匹配';
                    return `
                        <div class="ingredient-item">
                            <div class="ingredient-row">
                                <span class="ingredient-name">${ing.name}</span>
                                <span class="ingredient-match ${matchClass}">${matchText}</span>
                            </div>
                            <div class="ingredient-row">
                                <input type="number" class="ingredient-input weight" value="${ing.weight || 100}"
                                    id="rec-ing-w-${idx}" onchange="updateIngredientCalc(${idx})">
                                <span style="font-size:12px;color:#666;">克</span>
                                <input type="number" class="ingredient-input" value="${ing.calories || 0}"
                                    id="rec-ing-cal-${idx}" placeholder="kcal" onchange="updateIngredientCalc(${idx})">
                                <span style="font-size:12px;color:#666;">kcal</span>
                            </div>
                            <div style="font-size:11px;color:#999;margin-top:4px;">
                                蛋白质 <span id="rec-ing-p-${idx}">${(ing.protein || 0).toFixed(1)}</span>g ·
                                碳水 <span id="rec-ing-c-${idx}">${(ing.carbs || 0).toFixed(1)}</span>g ·
                                脂肪 <span id="rec-ing-f-${idx}">${(ing.fat || 0).toFixed(1)}</span>g

                    <div class="ingredient-item">
                        <div class="ingredient-row">
                            <span class="ingredient-name">${data.name}</span>
                        </div>
                        <div class="ingredient-row">

                                id="rec-ing-w-0" onchange="updatePackagedCalc()">
                            <span style="font-size:12px;color:#666;">克</span>
                            <span style="flex:1;text-align:right;font-size:14px;color:#4CAF50;font-weight:bold;">

                    <div class="total-row">
                        <span class="total-label">总热量</span>

                    </div>
                ` : ''}

                <div class="form-group" style="margin-top:10px;">
                    <label class="form-label">餐次</label>
                    <select class="form-select" id="rec-meal-type">
                        <option value="早餐" ${inferCurrentMealType()==='早餐'?'selected':''}>早餐</option>
                        <option value="午餐" ${inferCurrentMealType()==='午餐'?'selected':''}>午餐</option>
                        <option value="晚餐" ${inferCurrentMealType()==='晚餐'?'selected':''}>晚餐</option>
                        <option value="加餐" ${inferCurrentMealType()==='加餐'?'selected':''}>加餐</option>

                document.getElementById('rec-recipe-name-group').style.display = e.target.checked ? 'block' : 'none';

        function updateIngredientCalc(idx) {
            // Recalculate total when user changes values
            const ingredients = currentRecognitionData.ingredients || [];
            const weightInput = document.getElementById(`rec-ing-w-${idx}`);
            const calInput = document.getElementById(`rec-ing-cal-${idx}`);
            if (!weightInput || !calInput) return;

            const weight = parseInt(weightInput.value) || 100;
            const baseCalPer100 = ingredients[idx]?.calories || 0;
            const factor = weight / 100;
            const newCal = Math.round(baseCalPer100 * factor);
            calInput.value = newCal;

            // Recalculate grand total
            let totalCal = 0;
            for (let i = 0; i < ingredients.length; i++) {
                const wInput = document.getElementById(`rec-ing-w-${i}`);
                const cInput = document.getElementById(`rec-ing-cal-${i}`);
                if (wInput && cInput) {
                    totalCal += parseInt(cInput.value) || 0;
                }
            }
            document.getElementById('rec-grand-total').textContent = totalCal + ' kcal';
        }

        function updatePackagedCalc() {
            const weight = parseInt(document.getElementById('rec-ing-w-0').value) || 100;
            const baseCal = currentRecognitionData?.totalCalories || 0;
            const baseWeight = currentRecognitionData?.totalWeight || 100;
            const totalCal = Math.round(baseCal * weight / baseWeight);
            document.getElementById('rec-total-cal').textContent = totalCal;
        }

        async function confirmRecognition() {
            if (!currentRecognitionData || !currentUserId) return;

            const mealType = document.getElementById('rec-meal-type').value;
            const saveAsFood = document.getElementById('rec-save-food').checked;
            const saveAsRecipe = document.getElementById('rec-save-recipe').checked;
            const recipeName = document.getElementById('rec-recipe-name')?.value || '';

            // Build ingredients list
            const ingredients = [];
            let totalCalories = 0;
            let totalWeight = 0;

            if (currentRecognitionData.type === 'PACKAGED') {
                const weight = parseInt(document.getElementById('rec-ing-w-0').value) || 100;
                totalWeight = weight;
                totalCalories = parseInt(document.getElementById('rec-total-cal').textContent) || 0;
            } else if (currentRecognitionData.ingredients) {
                currentRecognitionData.ingredients.forEach((ing, idx) => {
                    const wInput = document.getElementById(`rec-ing-w-${idx}`);
                    const cInput = document.getElementById(`rec-ing-cal-${idx}`);
                    const weight = parseInt(wInput?.value) || 100;
                    const cal = parseInt(cInput?.value) || 0;
                    totalCalories += cal;
                    totalWeight += weight;
                    ingredients.push({
                        name: ing.name,
                        weight: weight,
                        calories: cal,
                        protein: ing.protein || 0,
                        carbs: ing.carbs || 0,
                        fat: ing.fat || 0,
                        matchedFoodId: ing.matchedFoodId,
                        matchedCustomFoodId: ing.matchedCustomFoodId
                    });
                });
            }

            try {
                const res = await fetch(`${API_BASE}/food/recognize/confirm`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUserId,
                        mealType: mealType,
                        recognitionType: currentRecognitionData.type,
                        name: currentRecognitionData.name,
                        ingredients: ingredients,
                        totalCalories: totalCalories,
                        totalWeight: totalWeight,
                        saveAsCustomFood: saveAsFood,
                        saveAsRecipe: saveAsRecipe,
                        recipeName: recipeName,
                        barcode: currentRecognitionData.barcode,
                        servingSize: totalWeight
                    })
                });
                const json = await res.json();
                if (json.code === 200) {
                    alert('添加成功！');
                    closeRecognitionModal();
                    document.querySelector('[data-tab="home"]').click();
                } else {
                    alert('保存失败：' + json.message);
                }
            } catch (e) {
                alert('保存失败，请重试');
            }
        }

            document.getElementById('recognition-modal').classList.remove('active');
