spring:
  application:
    name: food-diet-app

  datasource:
    url: jdbc:mysql://localhost:3306/food_diet?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0

server:
  port: 8080

ai:
  qwen:
    api-key: ${AI_API_KEY:sk-11af69ca20c54f82ac86ac5bc41e709f}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus-2025-07-28

  kimi:
    api-key: ${KIMI_API_KEY:your-api-key-here}
    base-url: https://api.moonshot.cn/v1
    model: moonshot-v1-8k

  baidu:
    app-id: ${BAIDU_APP_ID:}
    api-key: ${BAIDU_API_KEY:}
    secret-key: ${BAIDU_SECRET_KEY:}

jwt:
  secret: ${JWT_SECRET:FoodDietAppSecretKey2024VeryLongAndSecureForHS256Algorithm}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.food.diet: INFO
    org.springframework.web: INFO